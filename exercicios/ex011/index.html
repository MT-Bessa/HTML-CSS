<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html</title>
</head>
<body>
    <h1>Imagem dinamica </h1>
    <p>tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente ou diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 768px)" srcset="img/foto-p.png">
        <source media="(max-width: 1050px)" srcset="img/foto-m.png">
        <img src="img/foto-g.png" alt="imagem flexivel">
    </picture>
</body>
</html>
