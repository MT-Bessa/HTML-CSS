<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARÁGRAFOS</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>
        você pode escrever um parágrafo de qualquer jeito basta colocar no meio do par de tags &lt;p&gt; e &lt;/p&gt;.</p> <!-- lt = less than / gt = greater than -->
    <p>
        Se precisar quebrar a linha,<br> basta usar a tag &lt;br&gt;
    </p>
    <p>vamos adicionar alguns símbolos especiais: 
        &copy; 
        &reg; 
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &delta;
        &uarr;
    </p>
    <P> Vamos adicionar alguns emoji:
        &#x1F596;
        &#x1f913; <!-- só ver no emojipedia-->
    </P>
</body>
</html>
